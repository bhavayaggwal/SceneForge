<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Spike Boxes</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font: 13px system-ui, sans-serif; }
    canvas { display: block; max-width: 100vw; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    // Draws Qwen3-VL bbox_2d (0-1000 normalized) over a captured view: /boxes.html?v=view-1
    const v = new URLSearchParams(location.search).get('v') || 'view-1';
    const img = new Image();
    img.src = `/out/${v}.png`;
    await img.decode();
    const { objects = [] } = await (await fetch(`/out/${v}.boxes.json`)).json();
    const c = document.getElementById('c');
    c.width = img.width;
    c.height = img.height;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    g.lineWidth = 2;
    g.font = '14px system-ui';
    objects.forEach((o, i) => {
      const [x1, y1, x2, y2] = o.bbox_2d.map((n, k) => (n / 1000) * (k % 2 ? img.height : img.width));
      g.strokeStyle = g.fillStyle = `hsl(${(i * 47) % 360} 90% 60%)`;
      g.strokeRect(x1, y1, x2 - x1, y2 - y1);
      g.fillText(o.label, x1 + 3, y1 + 15);
    });
  </script>
</body>
</html>
